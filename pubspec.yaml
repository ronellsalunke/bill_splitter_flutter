name: bs_flutter
description: "Flutter client for Bill Splitter"

publish_to: "none"
version: 1.0.14+14

environment:
  sdk: ^3.14.0

dependencies:
  sentry_flutter: ^10.3.0
  material_ui: ^1.11.0
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.5
  dynamic_color: ^2.1.0
  url_launcher: ^6.3.2
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  hive_ce: ^2.19.3
  path_provider: ^2.1.6
  go_router: ^18.1.4
  equatable: ^2.1.0
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.0
  dropdown_button2: ^3.1.0
  get_it: ^9.2.1
  material_segmented_list: ^1.0.5
  package_info_plus: ^10.2.1
  quick_actions: ^1.1.0
  pub_semver: ^2.2.0
  flutter_slidable: ^5.2.0
  intl: ^0.20.3
  stupid_simple_sheet: ^0.9.1+1


dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  hive_ce_generator: ^1.11.0
  json_serializable: ^6.14.0
  build_runner: ^2.15.0
  #  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  bloc_lint: ^0.4.1
  flutter_launcher_icons: ^0.14.4
  #  integration_test:
  #    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png
  adaptive_icon_foreground_inset: 30
  min_sdk_android: 24
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/icons/app_icon.png
  adaptive_icon_monochrome: assets/icons/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: geist
      fonts:
        - asset: assets/fonts/geist.ttf

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: ronell-salunke
